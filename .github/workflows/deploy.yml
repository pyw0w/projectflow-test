# Deploys the static build to the `web` branch on every push to `main`.
# GitHub Pages must be configured to serve from the `web` branch root
# (Settings → Pages → Deploy from a branch → web / root).
#
# Flow: checkout → npm ci → npm test → npm run build → publish dist/ to `web`.
# The `web` branch contains ONLY the built bundle — no sources, no node_modules.

name: Deploy to GitHub Pages (web branch)

on:
  push:
    branches: [main]
  # allow manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # needed to push to the `web` branch

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Source checkout (main branch)
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Use the Node version pinned for reproducible installs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install exact dependency tree from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Run the test suite — deployment stops if any test fails
      - name: Run tests
        run: npm test

      # 5. Build the static bundle (base: '/projectflow-test/' in vite.config.js)
      - name: Build
        run: npm run build

      # 6. Publish ONLY dist/ to the `web` branch (orphan-style commit).
      #    Uses the built-in GITHUB_TOKEN — no secrets configured anywhere.
      - name: Deploy dist to web branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the existing web branch (empty if it does not exist yet)
          git fetch origin web || true
          workdir="$(mktemp -d)"
          git worktree add "$workdir" --force -B web FETCH_HEAD 2>/dev/null \
            || (cd "$workdir" && git checkout --orphan web)

          # Replace the branch content with the fresh build only
          find "$workdir" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R dist/. "$workdir/"

          cd "$workdir"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "deploy: $GITHUB_SHA"
            git push origin HEAD:web
          fi
